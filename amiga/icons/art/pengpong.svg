<?xml version="1.0" encoding="UTF-8"?>
<!-- Peng-Pong's GlowIcon art: a black court with a blue bar along its top,
     a red paddle at each side and a small orange ball, a penguin's head
     peeking up at the bottom. The AmiCradle Team's own drawing. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="court" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c2a"/><stop offset="1" stop-color="#030308"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a7cff"/><stop offset="1" stop-color="#1f2fb8"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6a6a"/><stop offset="1" stop-color="#b81c1c"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="12" fill="url(#court)" stroke="#000" stroke-width="3"/>
  <rect x="8" y="8" width="112" height="16" rx="8" fill="url(#bar)"/>
  <rect x="15" y="34" width="9" height="40" rx="4.5" fill="url(#pad)"/>
  <rect x="104" y="52" width="9" height="40" rx="4.5" fill="url(#pad)"/>
  <circle cx="74" cy="50" r="5.5" fill="#f08a1c" stroke="#7a3a00" stroke-width="1"/>
  <ellipse cx="64" cy="118" rx="22" ry="20" fill="#111" stroke="#444" stroke-width="1.5"/>
  <ellipse cx="64" cy="122" rx="13" ry="12" fill="#f4f4f4"/>
  <circle cx="57" cy="106" r="4" fill="#fff"/><circle cx="71" cy="106" r="4" fill="#fff"/>
  <circle cx="58" cy="107" r="2" fill="#000"/><circle cx="70" cy="107" r="2" fill="#000"/>
  <path d="M58 113 L70 113 L64 120 Z" fill="#f2a417" stroke="#8a5a00" stroke-width="1"/>
</svg>
